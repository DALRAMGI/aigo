[project]
name = "dashpi-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic>=1.20.1",
  "boto3>=1.43.124",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "moto[s3]>=5.2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
